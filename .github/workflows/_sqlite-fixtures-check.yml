name: "[sqlite-fixtures] Check (Reusable Workflow)"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sqlite-fixtures:
    name: SQLite fixture checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install SQLite client
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3

      - name: Run SQLite fixture checks
        run: script/check-sqlite-fixtures.sh
